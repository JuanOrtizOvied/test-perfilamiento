name: CloudFormation Stack

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        description: Select Environment
        options:
          - staging
          - production

env:
  HOSTED_ZONE: ${{ vars.DOMAIN }}

jobs:
  cloudformation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Set Environment Variables
        run: |
          case "${{ inputs.environment }}" in
            staging)
              echo "DOMAIN_NAME=staging-test-perfilamiento.${{ env.HOSTED_ZONE }}" >> $GITHUB_ENV
              ;;
            production)
              echo "DOMAIN_NAME=test-perfilamiento.${{ env.HOSTED_ZONE }}" >> $GITHUB_ENV
              ;;
            *)
              echo "Invalid environment selected." >&2
              exit 1
              ;;
          esac

      - name: Deploy to AWS CloudFormation (test-perfilamiento)
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: ${{ inputs.environment }}-test-perfilamiento-web
          template: cloudformation.yml
          no-fail-on-empty-changeset: "1"
          parameter-overrides: |
            HostedZone=${{ env.HOSTED_ZONE }},
            HostedZoneId=${{ secrets.AWS_HOSTED_ZONE_ID }},
            DomainName=${{ env.DOMAIN_NAME }},
            CertificateArn=${{ secrets.AWS_CERTIFICATE_ARN }}
