name: Staging

on:
  push:
    branches:
      - main
env:
  DOMAIN_NAME: staging-test-perfilamiento.${{ vars.DOMAIN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Setup Node
        uses: actions/setup-node@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Install dependencies
        run: yarn bootstrap

      - name: Build
        run: yarn build
        env:
          VITE_API_URL: https://staging-api.sabbi.com

      - name: Deploy On ${{ vars.DOMAIN }}
        run: aws s3 sync dist/ s3://${{ env.DOMAIN_NAME }}

      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.67.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: minor
          WITH_V: true
          INITIAL_VERSION: 1.0.0
          RELEASE_BRANCHES: main

      - name: Cleanup Old Files in S3
        run: |
          # Get the current date in seconds since epoch
          current_date=$(date +%s)
      
          # List all files in the bucket
          aws s3 ls s3://${{ env.DOMAIN_NAME }}/ --recursive | while read -r line; do
            # Extract the date and file path from the list output
            file_date=$(echo $line | awk '{print $1}')
            file_path=$(echo $line | awk '{$1=$2=$3=""; print $0}' | sed 's/^ *//')
      
            # Convert the file creation date to seconds since epoch
            file_date_epoch=$(date -d "$file_date" +%s)
      
            # Calculate the age of the file in days
            file_age=$(( (current_date - file_date_epoch) / (60*60*24) ))
      
            # Check if the file is older than 30 days
            if [ $file_age -gt 30 ]; then
              echo "Deleting $file_path (age: $file_age days)"
              aws s3 rm s3://${{ env.DOMAIN_NAME }}/$file_path
            fi
          done